name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ⬇️ STEP 1: Update manifest.json BEFORE building ⬇️
      - name: Update manifest.json version from Git Tag
        run: |
          node -e "
            const fs = require('fs');
            const manifestPath = './manifest.json';
            const rawTag = '${{ github.ref_name }}';
            // Strip leading 'v' (e.g., 'v2.1.0' -> '2.1.0')
            const cleanVersion = rawTag.replace(/^v/, '');
            
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = cleanVersion;
            
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
            console.log('Updated manifest.json version to:', cleanVersion);
          "

      # STEP 2: Build Vite extension (CRXJS will read the updated manifest.json)
      - name: Build extension
        run: npm run build

      # STEP 3: Create version.txt inside dist/ for the Go installer
      - name: Inject version.txt into dist
        run: echo "${{ github.ref_name }}" > dist/version.txt

      # STEP 4: Compress dist folder into release zip
      - name: Zip build output
        run: |
          cd dist
          zip -r ../chrome-extension-${{ github.ref_name }}.zip .

      # STEP 5: Publish release to GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chrome-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}